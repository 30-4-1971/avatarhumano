<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal de Luz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080827;color:white;font-family:Arial;overflow:hidden}
.live{width:100vw;height:100vh;max-width:562px;margin:auto;
background:radial-gradient(circle,#292064,#080827 75%);
position:relative;text-align:center;padding:25px 15px}
h1{color:#80edff;text-shadow:0 0 15px #00cfff;margin-top:20px}
.badge{border:1px solid #80edff;border-radius:25px;padding:10px;display:inline-block}
.avatar{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:230px}
.halo{width:210px;height:210px;border:4px solid #65eaff;
border-radius:50%;box-shadow:0 0 35px #65eaff;margin:auto}
.head{width:110px;height:140px;border-radius:45%;
background:linear-gradient(135deg,#d3d5ff,#50409b);
position:absolute;top:35px;left:60px;box-shadow:0 0 25px #65eaff}
.eye{position:absolute;top:58px;width:18px;height:10px;
background:#baffff;border-radius:50%;box-shadow:0 0 12px #fff}
.eye:first-child{left:20px}.eye:nth-child(2){right:20px}
.mouth{position:absolute;top:95px;left:42px;width:27px;
height:8px;border-bottom:3px solid white;border-radius:50%}
.speaking .mouth{animation:talk .2s infinite alternate}
@keyframes talk{to{height:20px;width:35px;left:38px}}
.body{width:190px;height:180px;margin:-5px auto;
border-radius:50% 50% 10% 10%;
background:linear-gradient(#a35bff,#1556a5,#080827);
box-shadow:0 0 35px #40dfff}
.messages{position:absolute;bottom:150px;left:5%;right:5%}
.message{background:#20164d;border:1px solid #987aff;
padding:12px;border-radius:20px;margin:8px;font-size:14px}
button{background:linear-gradient(90deg,#854cff,#00bfe9);
border:1px solid white;color:white;padding:14px 22px;
border-radius:25px;font-weight:bold;font-size:15px}
.controls{position:absolute;bottom:35px;left:0;right:0}
</style>
</head>
<body>
<div class="live">
<div class="badge">✦ LIVE · MENSAJES EN DIRECTO</div>
<h1>PORTAL DE LUZ</h1>

<div class="avatar" id="avatar">
<div class="halo"></div>
<div class="head">
<div class="eye"></div>
<div class="eye"></div>
<div class="mouth"></div>
</div>
<div class="body"></div>
</div>

<div class="messages" id="messages">
<div class="message">✨ Bienvenidos al Portal de Luz ✨</div>
</div>

<div class="controls">
<button onclick="activar()">🔊 ACTIVAR VOZ</button>
</div>
</div>

<script>
const mensajes=[
"Bienvenido al Portal de Luz. Hoy quiero transmitirte un mensaje de esperanza.",
"Recuerda que cada día es una nueva oportunidad para comenzar.",
"Confía en ti. Tienes mucho más valor del que a veces imaginas.",
"Deja espacio para las cosas bonitas que pueden llegar a tu vida.",
"Hoy es un buen momento para recuperar la ilusión y la tranquilidad.",
"Nunca olvides que mereces respeto, cariño y felicidad.",
"Permite que la esperanza ilumine tu camino.",
"Cada pequeño paso que das también es un avance."
];

let numero=0;
let activo=false;

function activar(){
if(!('speechSynthesis' in window)){
alert('Tu navegador no admite voz.');
return;
}
activo=!activo;
speechSynthesis.cancel();

if(activo){
hablar();
}
}

function hablar(){
if(!activo)return;

let texto=mensajes[numero%mensajes.length];
numero++;

let voz=new SpeechSynthesisUtterance(texto);
voz.lang='es-ES';
voz.rate=0.9;
voz.pitch=1.05;
voz.volume=1;

voz.onstart=()=>{
document.getElementById('avatar').classList.add('speaking');
document.getElementById('messages').innerHTML=
'<div class="message">✨ '+texto+'</div>';
};

voz.onend=()=>{
document.getElementById('avatar').classList.remove('speaking');
if(activo)setTimeout(hablar,5000);
};

voz.onerror=()=>{
document.getElementById('avatar').classList.remove('speaking');
};

speechSynthesis.speak(voz);
}
</script>
</body>
</html>
